<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
		<meta http-equiv="Pragma" content="no-cache" />
		<meta http-equiv="Expires" content="0" />
		<script>
			// Prevent FOUC by setting theme before any rendering
			(function () {
				const stored = localStorage.getItem("theme");
				let theme;
				if (stored === "light" || stored === "dark") {
					theme = stored;
				} else {
					// Default to system preference
					theme =
						window.matchMedia("(prefers-color-scheme: dark)").matches
							? "dark"
							: "light";
				}
				document.documentElement.dataset.theme = theme;
				document.documentElement.style.colorScheme = theme;
				// Set base font size immediately to prevent flash
				document.documentElement.style.fontSize = "118%";
			})();
			
			// Auto-reload on critical Svelte errors (cache busting)
			window.addEventListener('error', function(e) {
				if (e.message && e.message.includes('state_unsafe_mutation')) {
					const reloadKey = 'spacebot_error_reload';
					const lastReload = sessionStorage.getItem(reloadKey);
					const now = Date.now();
					// Only auto-reload once per 30 seconds to avoid loops
					if (!lastReload || (now - parseInt(lastReload)) > 30000) {
						sessionStorage.setItem(reloadKey, now.toString());
						// Clear module cache and reload
						if ('caches' in window) {
							caches.keys().then(names => {
								names.forEach(name => caches.delete(name));
							}).finally(() => {
								location.reload(true);
							});
						} else {
							location.reload(true);
						}
					}
				}
			});
		</script>
		<!-- Critical button CSS — inlined so buttons render correctly before JS loads.
		     The full button system lives in src/lib/styles/global.css;
		     this subset prevents FOUC during hydration / stale cache scenarios. -->
		<style id="critical-buttons">
			.btn {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: 0.5rem;
				padding: 0.625rem 1.25rem;
				font-size: 0.875rem;
				font-weight: 500;
				line-height: 1.25;
				border: 1px solid transparent;
				border-radius: 8px;
				cursor: pointer;
				text-decoration: none;
				white-space: nowrap;
			}
			.btn-primary {
				background: #7C3AED;
				color: white;
				font-weight: 600;
			}
			.btn-secondary {
				background: var(--color-surface-elevated, #242045);
				color: var(--color-text, #F0EEF8);
				border-color: var(--color-border, #302B58);
			}
			.btn-danger {
				background: #EF4444;
				color: white;
			}
			.btn-sm, .btn-small {
				padding: 0.375rem 0.75rem;
				font-size: 0.8rem;
			}
			a.btn { color: inherit; }
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
