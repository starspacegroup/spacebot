<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
		<meta http-equiv="Pragma" content="no-cache" />
		<meta http-equiv="Expires" content="0" />
		<script>
			// Prevent FOUC by setting theme before any rendering
			(function () {
				const stored = localStorage.getItem("theme");
				let theme;
				if (stored === "light" || stored === "dark") {
					theme = stored;
				} else {
					// Default to system preference
					theme =
						window.matchMedia("(prefers-color-scheme: dark)").matches
							? "dark"
							: "light";
				}
				document.documentElement.dataset.theme = theme;
				document.documentElement.style.colorScheme = theme;
			})();
			
			// Auto-reload on critical Svelte errors (cache busting)
			window.addEventListener('error', function(e) {
				if (e.message && e.message.includes('state_unsafe_mutation')) {
					const reloadKey = 'spacebot_error_reload';
					const lastReload = sessionStorage.getItem(reloadKey);
					const now = Date.now();
					// Only auto-reload once per 30 seconds to avoid loops
					if (!lastReload || (now - parseInt(lastReload)) > 30000) {
						sessionStorage.setItem(reloadKey, now.toString());
						// Clear module cache and reload
						if ('caches' in window) {
							caches.keys().then(names => {
								names.forEach(name => caches.delete(name));
							}).finally(() => {
								location.reload(true);
							});
						} else {
							location.reload(true);
						}
					}
				}
			});
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
