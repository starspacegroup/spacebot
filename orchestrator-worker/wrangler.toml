name = "spacebot-ai-orchestrator"
main = "src/index.ts"
# Needs a 2025+ runtime for Workflows step.waitForEvent (approval gates).
compatibility_date = "2025-06-01"

# Bind this consumer to the queue used by the Pages producer.
[[queues.consumers]]
queue = "spacebot-ai-autopilot"
max_batch_size = 10
max_batch_timeout = 5

# Superadmin workflow runs: Pages enqueues run starts / approval wake-ups;
# this worker creates or signals the SuperadminRunWorkflow instances.
# Create the queue once with: bunx wrangler queues create spacebot-workflow-runs
[[queues.consumers]]
queue = "spacebot-workflow-runs"
max_batch_size = 10
max_batch_timeout = 5

# Producer binding so this worker can also enqueue watchdog-sweep messages
# onto the same queue it consumes from.
[[queues.producers]]
binding = "AI_AUTOPILOT_QUEUE"
queue = "spacebot-ai-autopilot"

# Cron-driven dispatch workflow: durably calls the superadmin workflows
# dispatch endpoint on a fixed minute tick, replacing the old GCP/PM2 tick
# (scripts/cron.ts).
[[workflows]]
name = "spacebot-cron-dispatch"
binding = "CRON_DISPATCH_WORKFLOW"
class_name = "CronDispatchWorkflow"

# Durable driver for individual superadmin workflow runs: loops the Pages
# advance endpoint with durable sleeps and approval waits. One instance per
# run, deterministic id sa-run-<runId>.
[[workflows]]
name = "spacebot-superadmin-run"
binding = "SUPERADMIN_RUN_WORKFLOW"
class_name = "SuperadminRunWorkflow"

# Native Cloudflare Cron Triggers — provisioned automatically on `wrangler
# deploy`, no Cloudflare dashboard interaction required. "* * * * *" drives
# the superadmin workflows dispatch; "*/5 * * * *" drives the AI autopilot
# watchdog sweep.
[triggers]
crons = ["* * * * *", "*/5 * * * *"]

[vars]
# Base URL for the Pages app API (local or production)
# SPACEBOT_API_BASE = "https://spacebot.pages.dev"

# Internal shared key used by /api/ai/jobs/execute and /api/ai/jobs/sweep
# AI_AUTOPILOT_INTERNAL_KEY = ""

# Shared secret for the superadmin workflows dispatch endpoint (same value
# as the Pages app's CRON_SECRET / GCP Secret Manager entry).
# CRON_SECRET = ""
