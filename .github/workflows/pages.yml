name: Deploy docs to GitHub Pages

on:
    push:
        branches: [main]
        paths:
            - 'docs/**'
            - '.github/workflows/pages.yml'
    workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages and use OIDC for the deploy step.
permissions:
    contents: read
    pages: write
    id-token: write

# One concurrent Pages deploy; don't cancel an in-progress production deploy.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Configure Pages
              uses: actions/configure-pages@v5
              with:
                  # Self-enable Pages (Source: GitHub Actions) using the
                  # workflow's pages:write token, so no manual repo-settings
                  # toggle is required on first deploy.
                  enablement: true
            - name: Build Jekyll site from docs/
              uses: actions/jekyll-build-pages@v1
              with:
                  source: ./docs
                  destination: ./_site
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
