name: Deploy AI Orchestrator Worker

on:
    push:
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: deploy-ai-orchestrator-worker-prod
    cancel-in-progress: true

jobs:
    deploy:
        name: Deploy Worker
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                  node-version: '22'

            - name: Validate Cloudflare credentials
              working-directory: orchestrator-worker
              run: |
                  if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
                    echo "::error::Missing Cloudflare secrets. Expected CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."
                    exit 1
                  fi

                  if ! npx --yes wrangler@4.94.0 whoami; then
                    echo "::error::Wrangler authentication failed. Update GitHub secret CLOUDFLARE_API_TOKEN with a valid token that can deploy Workers and manage secrets."
                    exit 1
                  fi
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  WRANGLER_SEND_METRICS: 'false'

            - name: Deploy Cloudflare Worker
              working-directory: orchestrator-worker
              run: |
                  npx --yes wrangler@4.94.0 deploy --config wrangler.toml
                  printf '%s' "$SPACEBOT_API_BASE" | npx --yes wrangler@4.94.0 secret put SPACEBOT_API_BASE --config wrangler.toml
                  printf '%s' "$AI_AUTOPILOT_INTERNAL_KEY" | npx --yes wrangler@4.94.0 secret put AI_AUTOPILOT_INTERNAL_KEY --config wrangler.toml
                  printf '%s' "$CRON_SECRET" | npx --yes wrangler@4.94.0 secret put CRON_SECRET --config wrangler.toml
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  WRANGLER_SEND_METRICS: 'false'
                  SPACEBOT_API_BASE: ${{ secrets.ORCHESTRATOR_SPACEBOT_API_BASE }}
                  AI_AUTOPILOT_INTERNAL_KEY: ${{ secrets.AI_AUTOPILOT_INTERNAL_KEY }}
                  CRON_SECRET: ${{ secrets.CRON_SECRET }}
