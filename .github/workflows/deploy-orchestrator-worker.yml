name: Deploy AI Orchestrator Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ai-orchestrator-worker-prod
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Worker
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Deploy Cloudflare Worker
        working-directory: orchestrator-worker
        run: |
          printf '%s' "$SPACEBOT_API_BASE" | bunx --bun wrangler secret put SPACEBOT_API_BASE --config wrangler.toml
          printf '%s' "$AI_AUTOPILOT_INTERNAL_KEY" | bunx --bun wrangler secret put AI_AUTOPILOT_INTERNAL_KEY --config wrangler.toml
          bunx --bun wrangler deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SPACEBOT_API_BASE: ${{ secrets.ORCHESTRATOR_SPACEBOT_API_BASE }}
          AI_AUTOPILOT_INTERNAL_KEY: ${{ secrets.AI_AUTOPILOT_INTERNAL_KEY }}
