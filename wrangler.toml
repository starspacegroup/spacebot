name = "spacebot"
compatibility_date = "2024-01-26"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# D1 Database binding for event logs and automations
[[d1_databases]]
binding = "DB"
database_name = "spacebot-logs"
database_id = "6bce735c-2dca-43cd-9911-2eef7062377a"

# Environment variables (set these in Cloudflare dashboard or via wrangler CLI)
# Do not commit actual values here
[vars]
# DISCORD_PUBLIC_KEY = ""
# DISCORD_CLIENT_ID = ""
# DISCORD_CLIENT_SECRET = ""
# DISCORD_BOT_TOKEN = ""
# ADMIN_USER_IDS = ""
# CRON_SECRET = ""  # Secret for GitHub Actions scheduled jobs (also add to GitHub Secrets)

# Cloudflare AI Configuration
# Get these from the Cloudflare dashboard:
# - CLOUDFLARE_ACCOUNT_ID: Your Cloudflare account ID
# - CLOUDFLARE_AI_TOKEN: API token with Workers AI permissions
# - CLOUDFLARE_AI_GATEWAY_ID: (Optional) AI Gateway ID for analytics/caching
# - CLOUDFLARE_AI_MODEL: (Optional) Override default model
# CLOUDFLARE_ACCOUNT_ID = ""
# CLOUDFLARE_AI_TOKEN = ""
# CLOUDFLARE_AI_GATEWAY_ID = ""
# CLOUDFLARE_AI_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"

# NOTE: Cron triggers are NOT supported on Cloudflare Pages.
# Use an external cron service to call /api/cron endpoints instead:
# - "0 * * * *" = Every hour (stats aggregation) → POST /api/cron with job=hourly_aggregation
# - "0 0 * * *" = Daily at midnight (cleanup) → POST /api/cron with job=daily_refresh